# 公共默认配置：与数据集配置递归合并，同名参数由数据集配置及命令行覆盖。
# 模型专属默认值从 configs/models/<model_name>.yaml 加载；数据集配置与命令行优先。
model_name: diffuqkt  # 默认模型；可用 --model linearq 切换，原有未指定模型的命令保持兼容
model:  # 两种模型共用的知识追踪网络与对比学习设置
  embedding_dim: 128  # 嵌入维度 d；用于知识点、题目和状态向量，必须能被 num_heads 整除
  num_heads: 2  # 遗忘注意力的头数，必须为正整数
  dropout: 0.4  # 训练时 Dropout 的丢弃概率，取值范围 [0, 1)
  contrastive_negatives: enhanced  # 对比负样本状态来源：enhanced 为增强分支（论文公式 14）；original 为原始分支（作者实现）
loss:  # 两种模型共用的 KT + contrastive_weight * CL；DiffuQKT 另外加入扩散损失
  contrastive_weight: 0.001  # 对比学习损失 CL 的非负权重；设为 0 时跳过对比损失计算
  temperature: 0.3  # 对比学习相似度的温度，必须大于 0；越小则相似度分布越尖锐
train:  # 训练控制、设备选择和实验输出设置
  preprocess_each_run: false  # true 表示每次训练重建数据；false 复用已有结果，缺少 metadata.json 时仍自动处理
  seed: 42  # 训练随机种子，控制参数初始化与批次打乱；训练入口调用预处理时也使用此种子
  epochs: 100  # 最大训练轮数；可由 --epochs 覆盖，也可能因早停提前结束
  batch_size: 64  # 每个批次的序列窗口数，必须为正整数
  learning_rate: 0.002  # Adam 优化器的初始学习率
  weight_decay: 0.00001  # Adam 的 L2 权重衰减系数，用于参数正则化
  grad_clip: 15.0  # 反向传播后全模型梯度 L2 范数的截断上限
  patience: 10  # 验证选模指标连续未改善达到此轮数时早停，必须为正整数
  device: auto  # 运行设备：auto 自动优先使用 CUDA，也可显式设置 cpu、cuda 或 cuda:0
  num_workers: 0  # DataLoader 数据加载子进程数；0 表示在主进程加载
  num_threads: 4  # PyTorch 执行 CPU 算子时使用的线程数
  eval_seed: 2026  # 评估独立随机种子；DiffuQKT 用于反向扩散，LinearQ 的表示计算不使用随机采样
  output_root: experiments  # 实验根目录；按模型/数据集/实验名分组，基线目录为 diffuqk，根目录统一汇总 results.csv
